<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluffville - A Whimsical World of Fluff</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: #1e1e24;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        .game-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            box-shadow: 0 16px 40px rgba(0,0,0,0.6), 0 0 0 2px rgba(255,255,255,0.1);
            border-radius: 16px;
            cursor: pointer;
            max-width: 96vw;
            max-height: 90vh;
            aspect-ratio: 800 / 500;
        }
        .footer-tips {
            margin-top: 10px;
            font-size: 13px;
            color: #aaa;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div style="width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <span style="color: #ffb703; font-weight: bold; font-size: 14px;">🎨 Canvas 2D Version</span>
        <a href="fluffville.html" style="color: #ffffff; background: rgba(255,255,255,0.15); padding: 5px 14px; border-radius: 16px; text-decoration: none; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.25);">✨ Switch to DOM / CSS Version</a>
    </div>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="footer-tips">Tip: Click on your companion to interact and see special reactions!</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Game States: 'cover', 'nameInput', 'charSelect', 'gameplay', 'gameover'
let gameState = 'cover';

// Player Data
let playerName = "";
let selectedAnimal = null; // 'sheep', 'hamster', 'bunny', 'kitten', 'puppy'
let gameStartTime = 0;
let totalPlayTimeSec = 0;

// Interaction & Dialogue System
let lastTouchTime = 0;
let isInteracting = false;
let currentDialogue = "";
let showDialogueUntil = 0;
let dialogueInterval = null;

const sarcasticDialogues = [
    "Whatcha looking at?",
    "Don't you have anything else better to do?",
    "Even if you look at me, I won't give you my food.",
    "Go do some better work.",
    "Do you like me or something?",
    "Have you heard about privacy?",
    "Even if you like me, I cannot like you back.",
    "C'mon bro, we are different species, please understand."
];

// Animal Animation & Physics States
let animalState = {
    x: 400,
    y: 340,
    baseY: 340,
    animFrame: 0,
    touchStepCount: 0,
    actionTimer: 0,
    particles: []
};

// Character definitions
const companions = [
    { id: 'sheep', name: 'Sheep', emoji: '🐑', food: '🌿', foodName: 'Sweet Grass', desc: 'Loves Grass & Boings' },
    { id: 'hamster', name: 'Hamster', emoji: '🐹', food: '🫐', foodName: 'Blueberry', desc: 'Loves Berries & Waddles' },
    { id: 'bunny', name: 'Bunny', emoji: '🐇', food: '🥕', foodName: 'Crunchy Carrot', desc: 'Loves Carrots & Hops' },
    { id: 'kitten', name: 'Kitten', emoji: '🐈', food: '🥛', foodName: 'Warm Milk', desc: 'Loves Milk & Affection' },
    { id: 'puppy', name: 'Puppy', emoji: '🐕', food: '🦴', foodName: 'Juicy Bone', desc: 'Loves Bones & Tail Wags' }
];

// Input handling for Name Screen
let inputString = "";

window.addEventListener('keydown', (e) => {
    if (gameState === 'nameInput') {
        if (e.key === 'Enter') {
            submitPlayerName();
        } else if (e.key === 'Backspace') {
            inputString = inputString.slice(0, -1);
        } else if (e.key.length === 1 && inputString.length < 12) {
            if (/^[a-zA-Z0-9 _-]$/.test(e.key)) {
                inputString += e.key;
            }
        }
    }
});

function submitPlayerName() {
    if (inputString.trim() !== "") {
        playerName = inputString.trim();
    } else {
        playerName = "Explorer";
    }
    gameState = 'charSelect';
}

// Mouse / Touch handling with coordinate scaling
function getCanvasMousePos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
    };
}

canvas.addEventListener('mousedown', (e) => {
    const pos = getCanvasMousePos(e);
    handlePointerPress(pos.x, pos.y);
});

// Touch support for mobile/tablets
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        const x = (e.touches[0].clientX - rect.left) * scaleX;
        const y = (e.touches[0].clientY - rect.top) * scaleY;
        handlePointerPress(x, y);
    }
}, { passive: false });

function handlePointerPress(mouseX, mouseY) {
    if (gameState === 'cover') {
        gameState = 'nameInput';
    } 
    else if (gameState === 'nameInput') {
        // Check if clicked the 'Continue' button on screen
        if (mouseX >= 320 && mouseX <= 480 && mouseY >= 340 && mouseY <= 385) {
            submitPlayerName();
        }
    }
    else if (gameState === 'charSelect') {
        // Accurate card selection bounds matching drawCharSelectPage
        companions.forEach((card, index) => {
            const cardX = 50 + index * 144;
            const cardY = 150;
            const cardW = 124;
            const cardH = 230;

            if (mouseX >= cardX && mouseX <= cardX + cardW && mouseY >= cardY && mouseY <= cardY + cardH) {
                selectedAnimal = card.id;
                gameState = 'gameplay';
                gameStartTime = Date.now();
                resetAnimalPosition();
                startDialogueLoop();
            }
        });
    } 
    else if (gameState === 'gameplay') {
        // Exit button bounds: top right (620 to 780, 20 to 60)
        if (mouseX >= 620 && mouseX <= 780 && mouseY >= 20 && mouseY <= 60) {
            totalPlayTimeSec = Math.max(1, Math.floor((Date.now() - gameStartTime) / 1000));
            gameState = 'gameover';
            if (dialogueInterval) clearInterval(dialogueInterval);
            return;
        }

        // Trigger interaction action with companion
        triggerAnimalAction(mouseX, mouseY);
    }
    else if (gameState === 'gameover') {
        // Restart game to cover screen
        gameState = 'cover';
        inputString = "";
        selectedAnimal = null;
        if (dialogueInterval) clearInterval(dialogueInterval);
    }
}

function startDialogueLoop() {
    if (dialogueInterval) clearInterval(dialogueInterval);
    
    // Initial reminder dialogue after 2.5 seconds
    setTimeout(() => {
        if (gameState === 'gameplay' && !currentDialogue) {
            currentDialogue = "Hey " + playerName + "! What's up?";
            showDialogueUntil = Date.now() + 4000;
        }
    }, 2500);

    // Every 10 seconds, display a sarcastic statement for 5 seconds
    dialogueInterval = setInterval(() => {
        if (gameState === 'gameplay') {
            const randomIndex = Math.floor(Math.random() * sarcasticDialogues.length);
            currentDialogue = sarcasticDialogues[randomIndex];
            showDialogueUntil = Date.now() + 5000;
        }
    }, 10000);
}

function resetAnimalPosition() {
    animalState.x = 400;
    animalState.y = 340;
    animalState.baseY = 340;
    animalState.touchStepCount = 0;
    animalState.animFrame = 0;
    animalState.actionTimer = 0;
    animalState.particles = [];
}

function triggerAnimalAction(clickX, clickY) {
    isInteracting = true;
    lastTouchTime = Date.now();
    animalState.actionTimer = 50;

    // Add playful burst particles
    createSparks(animalState.x, animalState.y - 20, 8);

    if (selectedAnimal === 'hamster') {
        // Hamster moves back and forth alternately, clamped within canvas
        animalState.touchStepCount++;
        if (animalState.touchStepCount % 2 === 1) {
            animalState.x = Math.min(680, animalState.x + 60);
        } else {
            animalState.x = Math.max(180, animalState.x - 60);
        }
    }
}

function createSparks(x, y, count) {
    for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 2 + Math.random() * 3;
        animalState.particles.push({
            x: x,
            y: y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 1,
            life: 30,
            maxLife: 30,
            symbol: ['✨', '💖', '⭐', '🌸'][Math.floor(Math.random() * 4)]
        });
    }
}

function updateParticles() {
    for (let i = animalState.particles.length - 1; i >= 0; i--) {
        const p = animalState.particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.08;
        p.life--;
        if (p.life <= 0) {
            animalState.particles.splice(i, 1);
        }
    }
}

function drawParticles() {
    ctx.save();
    for (const p of animalState.particles) {
        const alpha = Math.max(0, p.life / p.maxLife);
        ctx.globalAlpha = alpha;
        ctx.font = "16px sans-serif";
        ctx.fillText(p.symbol, p.x, p.y);
    }
    ctx.restore();
}

// Main Game Loop update and render
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'cover') {
        drawCoverPage();
    } else if (gameState === 'nameInput') {
        drawNameInputPage();
    } else if (gameState === 'charSelect') {
        drawCharSelectPage();
    } else if (gameState === 'gameplay') {
        updateGameplay();
        drawGameplay();
    } else if (gameState === 'gameover') {
        drawGameOverPage();
    }

    requestAnimationFrame(gameLoop);
}

// 1. COVER PAGE (Ghibli Style)
function drawCoverPage() {
    let grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    grad.addColorStop(0, "#4a90e2");
    grad.addColorStop(0.45, "#a1c4fd");
    grad.addColorStop(0.75, "#fed1c7");
    grad.addColorStop(1, "#fbc2eb");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Warm Sun
    ctx.fillStyle = "rgba(255, 250, 220, 0.4)";
    ctx.beginPath();
    ctx.arc(680, 100, 70, 0, Math.PI * 2);
    ctx.fill();

    // Floating Clouds
    const t = Date.now() / 40;
    ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
    drawCloud((150 + t * 0.3) % 950 - 150, 80, 70);
    drawCloud((600 + t * 0.2) % 950 - 150, 120, 90);
    drawCloud((350 + t * 0.25) % 950 - 150, 60, 50);

    // Rolling green hills
    ctx.fillStyle = "#76c893";
    ctx.beginPath();
    ctx.arc(200, 520, 320, Math.PI, 2 * Math.PI);
    ctx.fill();

    ctx.fillStyle = "#52b788";
    ctx.beginPath();
    ctx.arc(620, 530, 370, Math.PI, 2 * Math.PI);
    ctx.fill();

    // Foreground soft hill
    ctx.fillStyle = "#40916c";
    ctx.beginPath();
    ctx.arc(400, 600, 380, Math.PI, 2 * Math.PI);
    ctx.fill();

    // Tiny flowers
    for (let i = 80; i < 740; i += 75) {
        ctx.font = "14px sans-serif";
        ctx.fillText("🌼", i, 465 + Math.sin(i) * 15);
    }

    // Title: Fluffville
    ctx.save();
    ctx.shadowColor = "rgba(0, 0, 0, 0.35)";
    ctx.shadowBlur = 12;
    ctx.shadowOffsetY = 4;
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 68px 'Comic Sans MS', cursive";
    ctx.textAlign = "center";
    ctx.fillText("Fluffville", canvas.width / 2, 175);

    ctx.font = "bold 22px 'Comic Sans MS', cursive";
    ctx.fillStyle = "#fff8db";
    ctx.fillText("✨ A Whimsical Cozy World of Fluff ✨", canvas.width / 2, 225);
    ctx.restore();

    // Pulsing Click to Enter badge
    let alpha = (Math.sin(Date.now() / 250) + 1) / 2;
    ctx.save();
    ctx.fillStyle = `rgba(255, 255, 255, ${0.85 + 0.15 * alpha})`;
    ctx.strokeStyle = "#fb8500";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 180, 345, 360, 55, 28);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#023047";
    ctx.font = "bold 20px 'Comic Sans MS', cursive";
    ctx.textAlign = "center";
    ctx.fillText("🐾 Click Anywhere to Enter 🐾", canvas.width / 2, 380);
    ctx.restore();
}

function drawCloud(x, y, size) {
    ctx.beginPath();
    ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y - size * 0.2, size * 0.4, 0, Math.PI * 2);
    ctx.arc(x + size * 0.8, y, size * 0.45, 0, Math.PI * 2);
    ctx.arc(x + size * 0.4, y + size * 0.1, size * 0.35, 0, Math.PI * 2);
    ctx.fill();
}

// 2. NAME INPUT PAGE
function drawNameInputPage() {
    drawCuteBorder("#ffb703", "#fb8500", "🐾");

    ctx.fillStyle = "#023047";
    ctx.font = "bold 32px 'Comic Sans MS'";
    ctx.textAlign = "center";
    ctx.fillText("Enter Your Explorer Name", canvas.width / 2, 140);

    ctx.font = "16px 'Comic Sans MS'";
    ctx.fillStyle = "#555";
    ctx.fillText("Every great adventurer needs a cozy name!", canvas.width / 2, 175);

    // Input Box
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#fb8500";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(200, 210, 400, 70, 16);
    ctx.fill();
    ctx.stroke();

    // Display entered text with blinking cursor
    const cursor = (Math.floor(Date.now() / 450) % 2 === 0) ? "|" : "";
    ctx.fillStyle = inputString ? "#023047" : "#aaa";
    ctx.font = "bold 28px 'Comic Sans MS'";
    const displayText = inputString ? (inputString + cursor) : ("Type name here" + cursor);
    ctx.fillText(displayText, canvas.width / 2, 255);

    // Instruction below box
    ctx.fillStyle = "#666";
    ctx.font = "15px 'Comic Sans MS'";
    ctx.fillText("Type with your keyboard, then press [ENTER] or click Continue", canvas.width / 2, 315);

    // Continue button
    ctx.fillStyle = "#fb8500";
    ctx.beginPath();
    ctx.roundRect(320, 340, 160, 45, 12);
    ctx.fill();
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 18px 'Comic Sans MS'";
    ctx.fillText("Continue ➔", canvas.width / 2, 369);
    ctx.textAlign = "left";
}

// 3. CHARACTER SELECTION PAGE
function drawCharSelectPage() {
    drawCuteBorder("#8ecae6", "#219ebc", "✨");

    ctx.fillStyle = "#023047";
    ctx.font = "bold 28px 'Comic Sans MS'";
    ctx.textAlign = "center";
    ctx.fillText(`Welcome, ${playerName || 'Explorer'}! Choose Your Companion`, canvas.width / 2, 95);

    ctx.font = "15px 'Comic Sans MS'";
    ctx.fillStyle = "#555";
    ctx.fillText("Pick who will accompany you in Fluffville:", canvas.width / 2, 125);

    companions.forEach((card, index) => {
        const x = 50 + index * 144;
        const y = 150;
        const w = 124;
        const h = 230;

        // Card background
        ctx.fillStyle = "#ffffff";
        ctx.strokeStyle = "#219ebc";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 14);
        ctx.fill();
        ctx.stroke();

        // Card inner header tint
        ctx.fillStyle = "#e0f2fe";
        ctx.beginPath();
        ctx.roundRect(x + 2, y + 2, w - 4, 100, [12, 12, 0, 0]);
        ctx.fill();

        // Companion emoji
        ctx.font = "52px 'Comic Sans MS'";
        ctx.textAlign = "center";
        ctx.fillText(card.emoji, x + w / 2, y + 72);

        // Name
        ctx.fillStyle = "#023047";
        ctx.font = "bold 17px 'Comic Sans MS'";
        ctx.fillText(card.name, x + w / 2, y + 130);

        // Food & trait
        ctx.fillStyle = "#d90429";
        ctx.font = "13px 'Comic Sans MS'";
        ctx.fillText(`${card.food} ${card.foodName}`, x + w / 2, y + 155);

        ctx.fillStyle = "#666";
        ctx.font = "11px 'Comic Sans MS'";
        ctx.fillText(card.desc, x + w / 2, y + 176);

        // SELECT button
        ctx.fillStyle = "#fb8500";
        ctx.beginPath();
        ctx.roundRect(x + 16, y + 190, w - 32, 28, 8);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px 'Comic Sans MS'";
        ctx.fillText("SELECT", x + w / 2, y + 209);
    });

    ctx.textAlign = "left";
}

// 4. GAMEPLAY PAGE
function updateGameplay() {
    if (isInteracting) {
        animalState.actionTimer--;
        if (animalState.actionTimer <= 0) {
            isInteracting = false;
        }
    }
    updateParticles();
}

function drawGameplay() {
    if (selectedAnimal === 'sheep') {
        drawSheepBackground();
    } else if (selectedAnimal === 'hamster') {
        drawHamsterBackground();
    } else if (selectedAnimal === 'bunny') {
        drawBunnyBackground();
    } else if (selectedAnimal === 'kitten') {
        drawKittenBackground();
    } else if (selectedAnimal === 'puppy') {
        drawPuppyBackground();
    }

    let timeSinceTouch = Date.now() - lastTouchTime;
    let doingAction = isInteracting && timeSinceTouch < 2500;

    // Draw Character & Food / Action
    ctx.save();
    ctx.translate(animalState.x, animalState.y);

    if (!doingAction) {
        drawAnimalResting();
        drawSpecificFood();
    } else {
        drawAnimalActionAnimation();
    }
    ctx.restore();

    // Draw active particle sparkles
    drawParticles();

    // HUD: Explorer name & companion pill (top left)
    ctx.fillStyle = "rgba(255, 255, 255, 0.9)";
    ctx.strokeStyle = "#023047";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(20, 20, 260, 42, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#023047";
    ctx.font = "bold 14px 'Comic Sans MS'";
    const currentCompanion = companions.find(c => c.id === selectedAnimal);
    const companionEmoji = currentCompanion ? currentCompanion.emoji : "";
    ctx.fillText(`Explorer: ${playerName} ${companionEmoji}`, 32, 46);

    // HUD: Exit Button (top right)
    ctx.fillStyle = "#e63946";
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(620, 20, 160, 42, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 15px 'Comic Sans MS'";
    ctx.textAlign = "center";
    ctx.fillText("Finish Journey 🚪", 700, 46);
    ctx.textAlign = "left";

    // Draw Sarcastic / Chatty Speech Bubble if active
    if (Date.now() < showDialogueUntil && currentDialogue) {
        drawSpeechBubble(animalState.x, animalState.y - 75, currentDialogue);
    }
}

// BACKGROUNDS & DRAWING ROUTINES FOR ANIMALS
function drawSheepBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, 500);
    grad.addColorStop(0, "#8ecae6");
    grad.addColorStop(0.6, "#cbe3fb");
    grad.addColorStop(1, "#e9d8a6");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 500);

    // Mountains in distance
    ctx.fillStyle = "#94a3b8";
    ctx.beginPath();
    ctx.moveTo(30, 310); ctx.lineTo(190, 140); ctx.lineTo(360, 310);
    ctx.fill();

    ctx.fillStyle = "#64748b";
    ctx.beginPath();
    ctx.moveTo(240, 310); ctx.lineTo(430, 110); ctx.lineTo(640, 310);
    ctx.fill();

    ctx.fillStyle = "#475569";
    ctx.beginPath();
    ctx.moveTo(520, 310); ctx.lineTo(680, 160); ctx.lineTo(820, 310);
    ctx.fill();

    // Floating clouds
    ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
    let cloudOffset = (Date.now() / 45) % 1000 - 150;
    drawCloud(cloudOffset, 70, 55);
    drawCloud((cloudOffset + 480) % 1000 - 150, 110, 65);

    // Plains Ground
    ctx.fillStyle = "#52b788";
    ctx.fillRect(0, 310, 800, 190);

    // Grass highlights
    ctx.fillStyle = "#40916c";
    for (let i = 0; i < 800; i += 30) {
        ctx.fillRect(i, 310, 15, 6);
    }
}

function drawHamsterBackground() {
    ctx.fillStyle = "#c99a6b";
    ctx.fillRect(0, 0, 800, 500);

    // Burrow circular soft nest
    ctx.fillStyle = "#a26a42";
    ctx.beginPath();
    ctx.arc(400, 270, 240, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#faedcd";
    ctx.beginPath();
    ctx.arc(400, 270, 210, 0, Math.PI * 2);
    ctx.fill();

    // Wood shavings texture
    ctx.strokeStyle = "#e9c46a";
    ctx.lineWidth = 3;
    for (let i = 230; i < 570; i += 35) {
        ctx.beginPath();
        ctx.arc(i, 360 + (i % 20), 12, 0, Math.PI);
        ctx.stroke();
    }

    // Background hamsters sleeping / burrowing
    ctx.font = "26px 'Comic Sans MS'";
    ctx.fillText("🐹💤", 230, 210);
    ctx.fillText("🐹💨", 530, 290);
    ctx.fillText("🌾", 270, 320);
    ctx.fillText("🌻", 510, 220);
}

function drawBunnyBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, 300);
    grad.addColorStop(0, "#a0c4ff");
    grad.addColorStop(1, "#cbf3f0");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 300);

    // Soft Garden hill ground
    ctx.fillStyle = "#74c69d";
    ctx.fillRect(0, 300, 800, 200);

    // Burrow entrance hole
    ctx.fillStyle = "#2d6a4f";
    ctx.beginPath();
    ctx.ellipse(400, 350, 75, 45, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#1b4332";
    ctx.beginPath();
    ctx.ellipse(400, 355, 60, 35, 0, 0, Math.PI * 2);
    ctx.fill();

    // Swaying grass blades
    ctx.strokeStyle = "#2d6a4f";
    ctx.lineWidth = 3;
    let sway = Math.sin(Date.now() / 240) * 12;
    for (let i = 25; i < 780; i += 32) {
        ctx.beginPath();
        ctx.moveTo(i, 500);
        ctx.quadraticCurveTo(i + sway, 440, i + sway * 1.6, 380);
        ctx.stroke();
    }
}

function drawKittenBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, 400);
    grad.addColorStop(0, "#ffe5d9");
    grad.addColorStop(1, "#ffd7ba");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 390);

    // Window with gentle sunlight
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(100, 80, 140, 160);
    ctx.fillStyle = "#bde0fe";
    ctx.fillRect(105, 85, 130, 150);
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(170, 85); ctx.lineTo(170, 235);
    ctx.moveTo(105, 160); ctx.lineTo(235, 160);
    ctx.stroke();

    // Wooden floor
    ctx.fillStyle = "#cb997e";
    ctx.fillRect(0, 390, 800, 110);
    ctx.strokeStyle = "#b07d62";
    ctx.lineWidth = 2;
    for (let y = 415; y < 500; y += 28) {
        ctx.beginPath();
        ctx.moveTo(0, y); ctx.lineTo(800, y);
        ctx.stroke();
    }

    // Cushion
    ctx.fillStyle = "#ffb703";
    ctx.beginPath();
    ctx.ellipse(400, 385, 100, 45, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#fb8500";
    ctx.beginPath();
    ctx.ellipse(400, 385, 35, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillText("🧶", 540, 420);
}

function drawPuppyBackground() {
    let grad = ctx.createLinearGradient(0, 0, 0, 320);
    grad.addColorStop(0, "#caf0f8");
    grad.addColorStop(1, "#90e0ef");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 800, 320);

    // Yard lawn
    ctx.fillStyle = "#52b788";
    ctx.fillRect(0, 320, 800, 180);

    // Fence
    ctx.fillStyle = "#f8f9fa";
    ctx.strokeStyle = "#dee2e6";
    ctx.lineWidth = 1;
    for (let f = 20; f < 500; f += 40) {
        ctx.fillRect(f, 240, 25, 80);
        ctx.beginPath();
        ctx.moveTo(f, 240); ctx.lineTo(f + 12.5, 220); ctx.lineTo(f + 25, 240);
        ctx.fill();
    }

    // Kennel house
    ctx.fillStyle = "#936639";
    ctx.fillRect(530, 160, 200, 180);

    // Roof
    ctx.fillStyle = "#582f0e";
    ctx.beginPath();
    ctx.moveTo(510, 165); ctx.lineTo(630, 85); ctx.lineTo(750, 165);
    ctx.fill();

    // Door opening
    ctx.fillStyle = "#2d1806";
    ctx.beginPath();
    ctx.arc(630, 250, 40, Math.PI, 0, false);
    ctx.lineTo(670, 340);
    ctx.lineTo(590, 340);
    ctx.fill();

    // Name plate
    ctx.fillStyle = "#ffb703";
    ctx.fillRect(600, 175, 60, 20);
    ctx.fillStyle = "#000";
    ctx.font = "bold 10px sans-serif";
    ctx.fillText("PUPPY", 612, 189);
}

// ANIMAL DRAWINGS & ACTIONS
function drawAnimalResting() {
    let bob = Math.sin(Date.now() / 300) * 3;

    ctx.font = "64px 'Comic Sans MS'";
    ctx.textAlign = "center";
    
    if (selectedAnimal === 'sheep') {
        ctx.fillText("🐑", 0, 10 + bob);
    } else if (selectedAnimal === 'hamster') {
        // Chubby hamster body with cute belly, feet & paws
        ctx.save();
        ctx.fillStyle = "#f4a261";
        ctx.beginPath();
        ctx.ellipse(0, 18 + bob, 32, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff1e6";
        ctx.beginPath();
        ctx.ellipse(0, 21 + bob, 20, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e07a5f";
        ctx.beginPath();
        ctx.ellipse(-14, 40 + bob, 8, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(14, 40 + bob, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(-10, 16 + bob, 5, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(10, 16 + bob, 5, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "52px 'Comic Sans MS'";
        ctx.fillText("🐹", 0, -4 + bob);
        ctx.restore();
    } else if (selectedAnimal === 'bunny') {
        ctx.fillText("🐇", 0, 10 + bob);
    } else if (selectedAnimal === 'kitten') {
        ctx.fillText("🐈", 0, 10 + bob);
    } else if (selectedAnimal === 'puppy') {
        ctx.fillText("🐕", 0, 10 + bob);
    }
}

function drawSpecificFood() {
    let floatY = Math.sin(Date.now() / 250) * 2;
    ctx.font = "34px 'Comic Sans MS'";
    ctx.textAlign = "center";

    if (selectedAnimal === 'sheep') {
        ctx.fillText("🌿", -45, 25 + floatY);
    } else if (selectedAnimal === 'hamster') {
        ctx.fillText("🫐", -40, 25 + floatY);
    } else if (selectedAnimal === 'bunny') {
        ctx.fillText("🥕", -42, 25 + floatY);
    } else if (selectedAnimal === 'kitten') {
        ctx.fillText("🥛", -42, 25 + floatY);
    } else if (selectedAnimal === 'puppy') {
        ctx.fillText("🦴", -42, 25 + floatY);
    }
}

function drawAnimalActionAnimation() {
    ctx.font = "64px 'Comic Sans MS'";
    ctx.textAlign = "center";

    const elapsed = 50 - animalState.actionTimer;

    if (selectedAnimal === 'sheep') {
        let jumpOffset = -Math.sin((elapsed / 50) * Math.PI) * 75;
        ctx.fillText("🐑", 0, 10 + jumpOffset);

        ctx.font = "bold 18px 'Comic Sans MS'";
        ctx.fillStyle = "#2d6a4f";
        ctx.fillText("✨ Boiiing! ✨", 0, -45 + jumpOffset);
    } 
    else if (selectedAnimal === 'hamster') {
        let waddleRot = Math.sin(elapsed * 0.4) * 0.15;
        ctx.save();
        ctx.rotate(waddleRot);
        ctx.fillStyle = "#f4a261";
        ctx.beginPath();
        ctx.ellipse(0, 18, 32, 24, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff1e6";
        ctx.beginPath();
        ctx.ellipse(0, 21, 20, 17, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#e07a5f";
        ctx.beginPath();
        ctx.ellipse(-14, 40, 8, 4, 0, 0, Math.PI * 2);
        ctx.ellipse(14, 40, 8, 4, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = "52px 'Comic Sans MS'";
        ctx.fillText("🐹", 0, -4);
        ctx.font = "26px sans-serif";
        ctx.fillText("🫐", 25, 12);
        ctx.restore();

        ctx.font = "bold 16px 'Comic Sans MS'";
        ctx.fillStyle = "#7209b7";
        ctx.fillText("Nom nom nom!", 0, 55);
    } 
    else if (selectedAnimal === 'bunny') {
        let hopOffset = -Math.abs(Math.sin(elapsed * 0.35)) * 45;
        ctx.fillText("🐇", 0, 10 + hopOffset);

        ctx.font = "bold 18px 'Comic Sans MS'";
        ctx.fillStyle = "#d62828";
        ctx.fillText("Hop! Hop!", 0, -35 + hopOffset);
    } 
    else if (selectedAnimal === 'kitten') {
        let pulse = 1 + Math.sin(elapsed * 0.2) * 0.15;
        ctx.scale(pulse, pulse);
        ctx.fillText("🐈💖", 0, 10);

        ctx.font = "bold 16px 'Comic Sans MS'";
        ctx.fillStyle = "#ae2012";
        ctx.fillText("*purrrs & rubs head*", 0, 52);
    } 
    else if (selectedAnimal === 'puppy') {
        let spinRot = Math.sin(elapsed * 0.3) * 0.35;
        let jumpOffset = -Math.sin(elapsed * 0.25) * 20;
        ctx.rotate(spinRot);
        ctx.fillText("🐕🐾", 0, 10 + jumpOffset);

        ctx.font = "bold 16px 'Comic Sans MS'";
        ctx.fillStyle = "#bc6c25";
        ctx.fillText("~waggy waggy tail!~", 0, 55);
    }
}

function drawSpeechBubble(targetX, targetY, text) {
    ctx.font = "bold 15px 'Comic Sans MS'";
    const textMetrics = ctx.measureText(text);
    const bubbleW = Math.max(160, textMetrics.width + 36);
    const bubbleH = 42;

    const halfW = bubbleW / 2;
    const clampedX = Math.max(halfW + 15, Math.min(canvas.width - halfW - 15, targetX));
    const clampedY = Math.max(50, targetY);

    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.2)";
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 3;

    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#023047";
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.roundRect(clampedX - halfW, clampedY - bubbleH, bubbleW, bubbleH, 12);
    ctx.fill();
    ctx.stroke();

    // Bubble pointer tail
    ctx.beginPath();
    ctx.moveTo(clampedX - 8, clampedY);
    ctx.lineTo(clampedX, clampedY + 12);
    ctx.lineTo(clampedX + 8, clampedY);
    ctx.closePath();
    ctx.fillStyle = "#ffffff";
    ctx.fill();
    ctx.stroke();

    ctx.restore();

    ctx.fillStyle = "#023047";
    ctx.font = "bold 14px 'Comic Sans MS'";
    ctx.textAlign = "center";
    ctx.fillText(text, clampedX, clampedY - bubbleH / 2 + 5);
    ctx.textAlign = "left";
}

// 5. LAST PAGE
function drawGameOverPage() {
    let mainColor = "#ffb703";
    let accentColor = "#fb8500";
    let foodEmoji = "🍎";

    if (selectedAnimal === 'sheep') { mainColor = "#52b788"; accentColor = "#2d6a4f"; foodEmoji = "🌿"; }
    else if (selectedAnimal === 'hamster') { mainColor = "#9b5de5"; accentColor = "#7209b7"; foodEmoji = "🫐"; }
    else if (selectedAnimal === 'bunny') { mainColor = "#f77f00"; accentColor = "#d62828"; foodEmoji = "🥕"; }
    else if (selectedAnimal === 'kitten') { mainColor = "#f3c4fb"; accentColor = "#ae2012"; foodEmoji = "🥛"; }
    else if (selectedAnimal === 'puppy') { mainColor = "#dda15e"; accentColor = "#bc6c25"; foodEmoji = "🦴"; }

    drawCuteBorder(mainColor, accentColor, foodEmoji);

    ctx.fillStyle = "#023047";
    ctx.font = "bold 32px 'Comic Sans MS'";
    ctx.textAlign = "center";
    ctx.fillText("🎉 Congratulations, Explorer! 🎉", canvas.width / 2, 150);

    ctx.font = "20px 'Comic Sans MS'";
    ctx.fillStyle = "#444";
    ctx.fillText("You have successfully spent quality time with your fluff:", canvas.width / 2, 205);

    let minutes = Math.floor(totalPlayTimeSec / 60);
    let seconds = totalPlayTimeSec % 60;
    let timeStr = "";
    if (minutes > 0) {
        timeStr = `${minutes} minute${minutes > 1 ? 's' : ''} and ${seconds} second${seconds !== 1 ? 's' : ''}`;
    } else {
        timeStr = `${seconds} second${seconds !== 1 ? 's' : ''}`;
    }

    // Time highlight badge
    ctx.fillStyle = mainColor;
    ctx.beginPath();
    ctx.roundRect(canvas.width / 2 - 200, 240, 400, 60, 16);
    ctx.fill();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 26px 'Comic Sans MS'";
    ctx.fillText(`⏱️ ${timeStr}`, canvas.width / 2, 278);

    ctx.fillStyle = "#666";
    ctx.font = "16px 'Comic Sans MS'";
    ctx.fillText(`(A delightful escape from reality with your ${selectedAnimal || 'friend'}!)`, canvas.width / 2, 335);

    let alpha = (Math.sin(Date.now() / 250) + 1) / 2;
    ctx.fillStyle = accentColor;
    ctx.font = "bold 20px 'Comic Sans MS'";
    ctx.fillText("✨ Click anywhere to play again ✨", canvas.width / 2, 395);
    ctx.textAlign = "left";
}

// Cute Animal Border Drawer Helper
function drawCuteBorder(primaryColor, secondaryColor, patternSymbol = "🐾") {
    ctx.fillStyle = "#fffdf9";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = primaryColor;
    ctx.lineWidth = 14;
    ctx.strokeRect(15, 15, canvas.width - 30, canvas.height - 30);

    ctx.strokeStyle = secondaryColor;
    ctx.lineWidth = 3;
    ctx.strokeRect(27, 27, canvas.width - 54, canvas.height - 54);

    ctx.font = "26px 'Comic Sans MS'";
    ctx.textAlign = "center";
    
    // Four Corners
    ctx.fillText(patternSymbol, 50, 58);
    ctx.fillText(patternSymbol, canvas.width - 50, 58);
    ctx.fillText(patternSymbol, 50, canvas.height - 40);
    ctx.fillText(patternSymbol, canvas.width - 50, canvas.height - 40);

    // Border midpoints
    ctx.font = "20px 'Comic Sans MS'";
    ctx.fillText(patternSymbol, canvas.width / 2, 50);
    ctx.fillText(patternSymbol, canvas.width / 2, canvas.height - 38);
    ctx.fillText(patternSymbol, 46, canvas.height / 2 + 8);
    ctx.fillText(patternSymbol, canvas.width - 46, canvas.height / 2 + 8);
}

// Start game loop
gameLoop();
